<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Performance</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Performance">
<meta name="theme-color" content="#1c2026">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="timer"><span class="t">1:30</span><button data-a="minus">−15</button><button data-a="plus">+15</button><button data-a="stop">✕</button></div>
<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM4 9h16M9 3v4M15 3v4"/><path d="M8 14l2.5 2.5L16 12"/></svg>Heute</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Pläne</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-6 4 3 7-8"/></svg>Fortschritt</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Körper</button>
  <button data-tab="macros"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>Makros</button>
</nav>
<div id="upd">Update verfügbar – tippen zum Laden</div>
<div id="sheet"><div class="in"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>

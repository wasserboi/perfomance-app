<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Performance</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Performance">
<meta name="theme-color" content="#1c2026">
<style>
:root{
  --bg:#1c2026; --bg2:#242930; --bg3:#2d333b; --line:#3a414b;
  --ink:#eef0f3; --ink2:#a4acb8; --ink3:#6f7885;
  --accent:#3f6fe8; --accent2:#5d86ef; --good:#3ec585; --warn:#e8a33f;
  --r:14px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;font-variant-numeric:tabular-nums}
input:focus,select:focus{border-color:var(--accent2)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
button{background:none;border:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.small{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{color:#ef6b6b}
.num{font-variant-numeric:tabular-nums}

#app{padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 110px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:8px 0 18px}
h1 small{display:block;font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:4px}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
.card{background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2);font-size:14px}
.tiny{color:var(--ink3);font-size:13px}
.empty{color:var(--ink2);padding:28px 8px;text-align:center;line-height:1.5}

/* Tabs */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(28,32,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink3);font-size:11px;font-weight:600}
nav button.on{color:var(--ink)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Timer bar */
#timer{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--accent);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
#timer.on{display:flex}
#timer .t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:1}
#timer button{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-weight:600;color:#fff}
#timer.done{background:var(--good);color:#0f2a1c}
#timer.done button{color:#0f2a1c}

/* Workout */
.ex{margin-bottom:12px}
.ex .name{font-weight:600;font-size:17px}
.ex .prev{color:var(--ink3);font-size:13px;margin-top:2px}
.sets{margin-top:8px;display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;align-items:center}
.sets .h{font-size:12px;color:var(--ink3);text-align:center}
.sets .n{color:var(--ink3);text-align:center;font-size:14px}
.sets input{text-align:center;padding:10px 4px;font-size:17px}
.sets .ok{width:46px;height:46px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.sets .ok.done{background:var(--good);border-color:var(--good);color:#0f2a1c}
.sets .ok svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.set.done input{color:var(--ink2)}

/* Progress bars (macros) */
.bar{height:10px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar i.over{background:var(--warn)}
.macro{margin-bottom:14px}
.macro .row{align-items:baseline}
.macro b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.list .item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:none}
canvas{width:100%;height:190px;display:block}
.chip{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--bg3);font-size:13px;color:var(--ink2);margin:0 6px 6px 0}
.chip.on{background:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}

/* Sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
#sheet.on{display:flex}
#sheet .in{background:var(--bg2);width:100%;border-radius:20px 20px 0 0;padding:18px var(--pad) calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
#sheet h3{font-size:19px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:10px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#scan{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1}
#scan video{width:100%;height:100%;object-fit:cover;display:block}
#scan .frame{position:absolute;left:12%;right:12%;top:35%;bottom:35%;border:2px solid #fff;border-radius:8px;opacity:.8}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.food:last-child{border-bottom:none}
.food .fn{font-weight:600}.food .fb{font-size:13px;color:var(--ink3)}
.food .fm{font-size:13px;color:var(--ink2);white-space:nowrap}
.amt{display:flex;gap:8px;align-items:center}
.amt input{font-size:26px;font-weight:700;text-align:center;padding:12px}
.amt span{font-size:18px;color:var(--ink2)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.calc div{background:var(--bg3);border-radius:10px;padding:8px 4px;text-align:center}
.calc b{display:block;font-size:18px}.calc small{color:var(--ink3);font-size:12px}
#upd{position:fixed;left:var(--pad);right:var(--pad);top:calc(env(safe-area-inset-top) + 10px);background:var(--good);color:#0f2a1c;border-radius:12px;padding:10px 14px;font-weight:600;display:none;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#upd.on{display:block}
.sets .n.wu{color:var(--warn);font-weight:700}
.sets .n{cursor:pointer;padding:6px 0}
.sug{display:inline-block;background:rgba(62,197,133,.18);color:var(--good);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px}
.note{color:var(--warn);font-size:13px;margin-top:4px}
.week{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.week div{background:var(--bg2);border-radius:12px;padding:10px;text-align:center}
.week b{display:block;font-size:22px;letter-spacing:-.02em}.week small{color:var(--ink3);font-size:12px}
.stale{color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--ink2);margin-right:4px;vertical-align:middle}
.tag.main{background:var(--accent);color:#fff}
.prow{background:var(--bg3);border-radius:12px;padding:10px;margin-bottom:8px}
.prow select{padding:8px 10px}
.stagebar{display:flex;gap:6px;margin-top:8px}.stagebar span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--bg3);color:var(--ink3)}.stagebar span.on{background:var(--accent);color:#fff;font-weight:600}.stagebar span.ok{color:var(--good)}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><span class="t">1:30</span><button data-a="t-15">−15</button><button data-a="t+15">+15</button><button data-a="tstop">✕</button></div>
<nav>
  <button data-tab="log" class="on"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="plans"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Pläne</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-6 4 3 7-8"/></svg>Fortschritt</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Körper</button>
  <button data-tab="macros"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>Makros</button>
</nav>
<div id="upd">Update verfügbar – tippen zum Laden</div>
<div id="sheet"><div class="in"></div></div>
<div class="toast" id="toast"></div>

<script>
if(location.search)history.replaceState(null,'',location.pathname);
/* ---------- State ---------- */
const KEY='perf.v1';
const clone=o=>JSON.parse(JSON.stringify(o));
const APP_VERSION='7';
const STAGES=[{sets:10,reps:3},{sets:7,reps:5},{sets:5,reps:7}];const TYPES=['Freihand','Maschine','Kabelturm'];
const stageLabel=st=>STAGES[st].sets+'×'+STAGES[st].reps;
const def={plans:[],workouts:[],weights:[],macros:{},foods:[],meals:[],measures:[],exNotes:{},dayType:{},goals:{p:180,c:250,f:80},goalsRest:null,settings:{rest:90,overload:2.5},active:null};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?Object.assign({},def,s):clone(def)}catch(e){return clone(def)}}
function save(){S.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));scheduleSync()}
/* ---------- GitHub Sync ---------- */
const SKEY='perf.sync';
let SY=JSON.parse(localStorage.getItem(SKEY)||'{"token":"","repo":"wasserboi/perf-data","sha":null,"last":0,"state":"off","pending":false}');
function saveSY(){localStorage.setItem(SKEY,JSON.stringify(SY))}
const ghUrl=()=>`https://api.github.com/repos/${SY.repo}/contents/data.json`;
const ghH=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json','Content-Type':'application/json'});
const b64e=str=>btoa(unescape(encodeURIComponent(str)));
const b64d=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
let syncT=null;
function scheduleSync(){if(!SY.token)return;SY.pending=true;saveSY();clearTimeout(syncT);syncT=setTimeout(pushSync,3000);setStatus('Änderungen werden gesichert…')}
async function ghGet(){const r=await fetch(ghUrl(),{headers:ghH(),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content))}}
async function pushSync(retry=true){
  if(!SY.token||!navigator.onLine)return;
  try{
    const body={message:'Backup '+new Date().toLocaleString('de-DE'),content:b64e(JSON.stringify(S))};if(SY.sha)body.sha=SY.sha;
    const r=await fetch(ghUrl(),{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&retry){const g=await ghGet();SY.sha=g?g.sha:null;saveSY();return pushSync(false)}
    if(!r.ok)throw new Error('GitHub '+r.status);
    const j=await r.json();SY.sha=j.content.sha;SY.last=Date.now();SY.pending=false;SY.state='ok';saveSY();setStatus();
  }catch(e){SY.state='err:'+e.message;saveSY();setStatus()}
}
async function pullSync(force){
  if(!SY.token||!navigator.onLine)return;
  try{
    const g=await ghGet();
    if(!g){await pushSync();return}
    SY.sha=g.sha;
    if(force||(g.data.updatedAt||0)>(S.updatedAt||0)){S=Object.assign({},def,g.data);localStorage.setItem(KEY,JSON.stringify(S));SY.state='ok';SY.last=Date.now();SY.pending=false;saveSY();render();if(force)toast('Backup wiederhergestellt')}
    else if(SY.pending||(S.updatedAt||0)>(g.data.updatedAt||0))await pushSync();
    else{SY.state='ok';saveSY()}
    setStatus();
  }catch(e){SY.state='err:'+e.message;saveSY();setStatus()}
}
function syncText(){
  if(!SY.token)return'Kein Cloud-Backup eingerichtet';
  if(SY.state.startsWith('err'))return'Backup fehlgeschlagen ('+SY.state.slice(4)+') – Token und Repo prüfen';
  if(SY.pending)return navigator.onLine?'Änderungen werden gesichert…':'Offline – wird gesichert, sobald Netz da ist';
  return SY.last?'Gesichert '+new Date(SY.last).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Bereit';
}
function setStatus(t){const el=document.getElementById('syncStatus');if(el)el.textContent=t||syncText()}
window.addEventListener('online',()=>{if(SY.pending)pushSync()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullSync()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>new Date(d+(d.length===10?'T12:00':'')).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const fmtDL=d=>new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
let tab='log',progEx=null,macroDay=today();
const app=document.getElementById('app');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  app.innerHTML=({log:vLog,plans:vPlans,progress:vProgress,body:vBody,macros:vMacros})[tab]();
  if(tab==='progress')drawProgress();
  if(tab==='body')drawWeight();
  window.scrollTo(0,0);
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render()};

/* ---------- Training ---------- */
function lastSets(name){
  for(let i=S.workouts.length-1;i>=0;i--){const ex=S.workouts[i].exercises.find(x=>x.name===name);if(ex){const d=ex.sets.filter(s=>s.done&&s.w>0&&!s.wu);if(d.length)return d}}
  return null;
}
function vLog(){
  if(S.active)return vActive();
  const recent=S.workouts.slice(-8).reverse();
  const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const wkW=S.workouts.filter(w=>new Date(w.date)>=mon);
  const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
  return `<h1>Training<small>${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</small></h1>
  <div class="week"><div><b>${wkW.length}</b><small>Einheiten diese Woche</small></div><div><b class="num">${Math.round(wkW.reduce((a,w)=>a+vol(w),0)/1000*10)/10}</b><small>Tonnen bewegt</small></div><div><b class="num">${Math.round(wkW.reduce((a,w)=>a+w.duration,0)/60)}</b><small>Minuten</small></div></div>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">Workout starten</div>
    ${S.plans.map(p=>`<button class="btn wide" style="margin-bottom:8px;justify-content:space-between" data-a="start" data-id="${p.id}"><span>${esc(p.name)}</span><span class="tiny ${(()=>{const l=planWorkouts(p.id,p.name).slice(-1)[0];return l&&days(l.date)>7?'stale':''})()}">${(()=>{const l=planWorkouts(p.id,p.name).slice(-1)[0];if(!l)return 'noch nie';const d=days(l.date);return d===0?'heute':d===1?'gestern':'vor '+d+' Tagen'})()}</span></button>`).join('')}
    <button class="btn wide ${S.plans.length?'':'primary'}" data-a="start">Freies Training</button>
  </div>
  <h2>Verlauf</h2>
  ${recent.length?recent.map(w=>`<div class="card row between" data-a="showw" data-id="${w.id}"><div><div style="font-weight:600">${esc(w.name)}</div><div class="tiny">${fmtDL(w.date)} · ${w.exercises.length} Übungen · ${Math.round(w.duration/60)} min</div></div><div class="num" style="text-align:right">${(()=>{const h=planWorkouts(w.planId,w.name),i=h.findIndex(x=>x.id===w.id),c=i>0?compare(w,h[i-1]):null;return c?`<div style="font-weight:600;color:${pctC(c.pct)}">${pctS(c.pct)}</div>`:''})()}<div class="muted">${vol(w).toLocaleString('de-DE')} kg</div></div></div>`).join(''):`<div class="empty">Noch kein Training gespeichert.</div>`}`;
}
function vol(w){return w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done&&!s.wu).reduce((b,s)=>b+s.w*s.r,0),0)}
const work=e=>e.sets.filter(s=>!s.wu);
function vActive(){
  const a=S.active,min=Math.round((Date.now()-a.start)/60000);
  return `<div class="row between" style="margin-top:6px"><h1 style="margin:0">${esc(a.name)}<small>${min} min · ${vol(a).toLocaleString('de-DE')} kg bewegt${a.basedOn?' · Basis: letztes Training':''}</small></h1><button class="btn ghost danger small" data-a="cancel">Abbrechen</button></div>
  ${a.exercises.map((ex,ei)=>{const prev=lastSets(ex.name);return `<div class="card ex">
    <div class="row between"><div class="grow"><div class="name">${ex.main?'<span class="tag main">Main</span>':''}${ex.type?`<span class="tag">${ex.type}</span>`:''}${esc(ex.name)}${ex.sug?`<span class="sug">↑ +${String(ex.sug).replace(".",",")} kg</span>`:''}</div>${ex.main?`<div class="stagebar">${STAGES.map((c,i)=>`<span class="${i===ex.stage?'on':i<ex.stage?'ok':''}">${c.sets}×${c.reps}</span>`).join('')}</div><div class="prev">Ziel: ${STAGES[ex.stage].sets} Sätze × ${STAGES[ex.stage].reps} mit ${ex.sets.find(s=>!s.wu)?.w} kg</div>`:''}<div class="prev">${prev?'Letztes Mal: '+prev.map(s=>s.w+'×'+s.r).join(', '):'Erstes Mal'}${ex.targetReps?' · Ziel '+ex.targetReps+' Reps':''}</div>${S.exNotes[ex.name]?`<div class="note">${esc(S.exNotes[ex.name])}</div>`:''}</div><button class="btn ghost small" data-a="note" data-i="${ei}">Notiz</button><button class="btn ghost small" data-a="rmex" data-i="${ei}">✕</button></div>
    <div class="sets"><div class="h">Satz</div><div class="h">kg</div><div class="h">Reps</div><div class="h"></div>
    ${ex.sets.map((s,si)=>`<div class="n ${s.wu?'wu':''}" data-a="wu" data-i="${ei}" data-s="${si}">${s.wu?'W':si+1}</div><input type="number" inputmode="decimal" step="0.5" value="${s.w||''}" placeholder="${prev?.[si]?.w??''}" data-f="w" data-i="${ei}" data-s="${si}"><input type="number" inputmode="numeric" value="${s.r||''}" placeholder="${prev?.[si]?.r??ex.targetReps??''}" data-f="r" data-i="${ei}" data-s="${si}"><button class="ok ${s.done?'done':''}" data-a="done" data-i="${ei}" data-s="${si}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>`).join('')}
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" data-a="addset" data-i="${ei}">+ Satz</button><button class="btn ghost small" data-a="addwu" data-i="${ei}">+ Aufwärmsatz</button>${ex.sets.length>1?`<button class="btn ghost small" data-a="rmset" data-i="${ei}">− Satz</button>`:''}</div>
  </div>`}).join('')}
  <div class="tiny" style="margin:-2px 0 12px">Satznummer antippen = Aufwärmsatz (zählt nicht für Score und Volumen).</div>

function planWorkouts(planId,name){return S.workouts.filter(w=>planId?w.planId===planId:w.name===name)}
function startWorkout(planId){
  const p=S.plans.find(x=>x.id===planId);
  let exercises=[];
  if(p){
    const last=planWorkouts(p.id,p.name).slice(-1)[0];
    const step=S.settings.overload||2.5;
    const mainEx=e=>{const st=e.state||{weight:e.weight,stage:0},cfg=STAGES[st.stage];return{name:e.name,type:e.type,main:true,stage:st.stage,targetReps:cfg.reps,sets:Array.from({length:cfg.sets},()=>({w:st.weight,r:cfg.reps,done:false}))}};
    if(last)exercises=last.exercises.map(e=>{const pe=p.exercises.find(x=>x.name===e.name);if(pe?.main)return mainEx(pe);const target=pe?.reps||e.targetReps||0;const ws=e.sets.filter(x=>!x.wu);
      const hit=target&&ws.length&&ws.every(x=>x.r>=target)&&ws.some(x=>x.w>0);
      return{name:e.name,type:pe?.type||e.type,targetReps:target||undefined,sug:hit?step:0,sets:e.sets.map(x=>({w:hit&&!x.wu?Math.round((x.w+step)*2)/2:x.w,r:x.r,done:false,wu:!!x.wu}))}});
    p.exercises.forEach(e=>{if(!exercises.some(x=>x.name===e.name))exercises.push(e.main?mainEx(e):{name:e.name,type:e.type,targetReps:e.reps,sets:Array.from({length:e.sets||3},()=>({w:0,r:0,done:false}))})});
    const mi=exercises.findIndex(e=>e.main);if(mi>0){const [m]=exercises.splice(mi,1);exercises.unshift(m)}
  }
  S.active={id:uid(),name:p?p.name:'Freies Training',planId:planId||null,start:Date.now(),basedOn:!!(p&&exercises.length&&exercises[0].sets[0].w),exercises};
  save();render();
}
function finishWorkout(){
  const a=S.active;a.exercises=a.exercises.map(e=>({name:e.name,type:e.type,main:e.main,stage:e.stage,targetReps:e.targetReps,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.some(s=>!s.wu));
  if(!a.exercises.length){toast('Keine Sätze abgehakt');return}
  let mainRes=null;const p=S.plans.find(x=>x.id===a.planId),me=a.exercises.find(e=>e.main),pe=p&&me&&p.exercises.find(x=>x.name===me.name&&x.main);
  if(pe){const st=pe.state||{weight:pe.weight,stage:0},cfg=STAGES[st.stage],ws=me.sets.filter(x=>!x.wu);
    const ok=ws.length>=cfg.sets&&ws.slice(0,cfg.sets).every(x=>x.r>=cfg.reps&&x.w>=st.weight);
    const next=ok?(st.stage<2?{weight:st.weight,stage:st.stage+1}:{weight:st.weight+(pe.step||10),stage:0}):st;

function bestRm(e){return work(e).reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0)}
function compare(w,ref){
  if(!ref)return null;
  const common=w.exercises.filter(e=>ref.exercises.some(x=>x.name===e.name));
  if(!common.length)return null;
  const cur=common.reduce((a,e)=>a+bestRm(e),0),old=common.reduce((a,e)=>a+bestRm(ref.exercises.find(x=>x.name===e.name)),0);
  const cv=common.reduce((a,e)=>a+work(e).reduce((b,s)=>b+s.w*s.r,0),0),ov=common.reduce((a,e)=>a+work(ref.exercises.find(x=>x.name===e.name)).reduce((b,s)=>b+s.w*s.r,0),0);

function allExercises(){const m={};S.workouts.forEach(w=>w.exercises.forEach(e=>m[e.name]=(m[e.name]||0)+1));return Object.keys(m).sort((a,b)=>m[b]-m[a])}

    <div class="card"><div class="tiny">Zuletzt</div><div class="num" style="font-size:24px;font-weight:700">${last.w} × ${last.r}</div><div class="tiny">${fmtD(last.d)} · Volumen ${last.vol} kg</div></div>
  </div>
  <div class="card list">${h.slice(-10).reverse().map(x=>`<div class="item"><span class="muted">${fmtD(x.d)}</span><span class="num">${x.w} × ${x.r} <span class="tiny">≈ ${Math.round(x.rm)} kg</span></span></div>`).join('')}</div>`;

function drawProgress(){const h=exHistory(progEx);lineChart(document.getElementById('c1'),h.map(x=>({d:x.d,y:Math.round(x.rm)})))}
function lineChart(cv,pts,raw){
  if(!cv)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=190;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cs=getComputedStyle(document.body),acc=cs.getPropertyValue('--accent').trim(),ink3=cs.getPropertyValue('--ink3').trim();
  if(pts.length<1){c.fillStyle=ink3;c.font='14px sans-serif';c.fillText('Noch keine Daten',10,30);return}
  const L=38,R=10,T=14,B=26,ys=pts.map(p=>p.y).concat((raw||[]).map(p=>p.y));let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=5;lo-=5}const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const X=i=>pts.length>1?L+(W-L-R)*i/(pts.length-1):(L+W-R)/2,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  c.strokeStyle='#3a414b';c.lineWidth=1;c.fillStyle=ink3;c.font='11px -apple-system,sans-serif';c.textAlign='right';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.fillText(Math.round(v),L-6,y+4)}
  c.textAlign='center';const step=Math.ceil(pts.length/5);pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)c.fillText(fmtD(p.d),X(i),H-8)});
  c.strokeStyle=acc;c.lineWidth=2.5;c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));c.stroke();
  if(raw){c.fillStyle=ink3;raw.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p.y),2.5,0,7);c.fill()})}else{c.fillStyle=acc;pts.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p.y),3.5,0,7);c.fill()})}
}

/* ---------- Körper ---------- */
function vBody(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),last=ws[ws.length-1],wk=ws.filter(x=>x.d>=new Date(Date.now()-7*864e5).toISOString().slice(0,10));
  const avg=wk.length?wk.reduce((a,x)=>a+x.w,0)/wk.length:null;
  return `<h1>Körper<small>Gewicht & Pausen-Timer</small></h1>
  <div class="card"><div class="row"><div class="grow"><label class="f">Gewicht heute (kg)</label><input type="number" inputmode="decimal" step="0.1" id="wIn" value="${ws.find(x=>x.d===today())?.w??''}" placeholder="${last?last.w:'z. B. 82.5'}"></div><button class="btn primary" data-a="savew" style="margin-top:18px">Speichern</button></div></div>
  <div class="grid2">
    <div class="card"><div class="tiny">Aktuell</div><div class="num" style="font-size:26px;font-weight:700">${last?last.w.toFixed(1):'–'}<span class="tiny"> kg</span></div><div class="tiny">${last?fmtD(last.d):''}</div></div>
    <div class="card"><div class="tiny">Ø 7 Tage</div><div class="num" style="font-size:26px;font-weight:700">${avg?avg.toFixed(1):'–'}<span class="tiny"> kg</span></div><div class="tiny">${wk.length} Einträge</div></div>
  </div>
  <div class="card"><div class="row between"><span class="muted">Gewicht</span><span class="tiny"><span style="color:var(--accent2)">■</span> Trend&nbsp; <span style="color:var(--ink3)">●</span> Tageswerte</span></div><canvas id="c2"></canvas></div>
  <h2>Maße</h2>
  <div class="card">
    ${(()=>{const m=[...S.measures].sort((a,b)=>a.d<b.d?-1:1),l=m[m.length-1],t=m.find(x=>x.d===today())||{};const f=(k,lab)=>`<div><label class="f">${lab}</label><input type="number" inputmode="decimal" step="0.5" id="ms_${k}" value="${t[k]??''}" placeholder="${l?.[k]??'cm'}"></div>`;
      return `<div class="grid4">${f('waist','Bauch')}${f('chest','Brust')}${f('arm','Arm')}${f('thigh','Bein')}</div><button class="btn primary wide" data-a="savem" style="margin-top:10px">Maße speichern</button>
      ${m.length?`<div class="list" style="margin-top:8px">${m.slice(-5).reverse().map(x=>`<div class="item"><span class="muted">${fmtD(x.d)}</span><span class="num tiny">${['waist','chest','arm','thigh'].filter(k=>x[k]).map(k=>({waist:'B',chest:'Br',arm:'A',thigh:'Be'})[k]+' '+x[k]).join(' · ')}</span></div>`).join('')}</div>`:'<div class="tiny" style="margin-top:8px">Alle 2–4 Wochen messen reicht.</div>'}`})()}
  </div>
  <h2>Pausen-Timer</h2>
  <div class="grid4">${[60,90,120,180].map(s=>`<button class="btn" data-a="timer" data-s="${s}">${s>=120?s/60+' min':s+' s'}</button>`).join('')}</div>
  ${ws.length?`<h2>Einträge</h2><div class="card list">${ws.slice(-10).reverse().map(x=>`<div class="item"><span class="muted">${fmtD(x.d)}</span><span class="row"><span class="num">${x.w.toFixed(1)} kg</span><button class="btn ghost small" data-a="rmw" data-d="${x.d}">✕</button></span></div>`).join('')}</div>`:''}`;
}
function trend(ws,k=0.3){let e=null;return ws.map(x=>{e=e===null?x.w:e+k*(x.w-e);return{d:x.d,y:Math.round(e*100)/100}})}
function drawWeight(){const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-60);lineChart(document.getElementById('c2'),trend(ws),ws.map(x=>({d:x.d,y:x.w})))}

/* ---------- Makros ---------- */
function vMacros(){
  const items=S.macros[macroDay]||[],t=items.reduce((a,i)=>({p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{p:0,c:0,f:0});
  const isTrain=dayIsTrain(macroDay),g=isTrain?S.goals:(S.goalsRest||S.goals);
  const kcal=o=>o.kcal||Math.round(o.p*4+o.c*4+o.f*9),gk=kcal(g),tk=items.reduce((a,i)=>a+kcal(i),0);
  const bar=(l,v,goal,u='g')=>`<div class="macro"><div class="row between"><span>${l}</span><span class="num"><b>${Math.round(v)}</b> <span class="tiny">/ ${goal} ${u}</span></span></div><div class="bar"><i class="${v>goal*1.1?'over':''}" style="width:${Math.min(100,v/goal*100)}%"></i></div></div>`;
  const isT=macroDay===today();
  return `<div class="row between" style="margin-top:6px"><h1 style="margin:0">Makros<small>${isT?'Heute':fmtDL(macroDay+'T12:00')} · noch ${Math.max(0,Math.round(g.p-t.p))} g Protein</small></h1><div class="row"><button class="btn ghost small" data-a="mday" data-o="-1">‹</button><button class="btn ghost small" data-a="mday" data-o="1" ${isT?'disabled style="opacity:.3"':''}>›</button></div></div>
  <div class="card">
    ${bar('Protein',t.p,g.p)}${bar('Kohlenhydrate',t.c,g.c)}${bar('Fett',t.f,g.f)}${bar('Kalorien',tk,gk,'kcal')}
    <div class="row between"><button class="btn ghost small" data-a="goals">Ziele anpassen</button><button class="btn small" data-a="daytype">${isTrain?'Trainingstag':'Ruhetag'} ⇄</button></div>
  </div>
  ${(()=>{const days=[...Array(7)].map((_,i)=>{const d=new Date(macroDay+'T12:00');d.setDate(d.getDate()-i);return d.toISOString().slice(0,10)}).filter(d=>(S.macros[d]||[]).length);if(days.length<2)return'';
    const sum=days.map(d=>S.macros[d].reduce((a,i)=>({p:a.p+i.p,c:a.c+i.c,f:a.f+i.f,k:a.k+kcal(i)}),{p:0,c:0,f:0,k:0}));const avg=k=>Math.round(sum.reduce((a,x)=>a+x[k],0)/days.length);
    const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),ref=new Date(macroDay+'T12:00');ref.setDate(ref.getDate()-7);const before=ws.filter(x=>x.d<=ref.toISOString().slice(0,10)).slice(-1)[0],now=ws.filter(x=>x.d<=macroDay).slice(-1)[0];const dw=before&&now&&before.d!==now.d?now.w-before.w:null;
    return `<div class="card"><div class="row between"><span class="muted">Ø letzte ${days.length} Tage</span><span class="tiny num">${avg('k')} kcal · P ${avg('p')} · C ${avg('c')} · F ${avg('f')}</span></div>${dw!==null?`<div class="tiny" style="margin-top:6px">Gewicht in 7 Tagen: <span class="num" style="color:${Math.abs(dw)<0.3?'var(--ink2)':dw>0?'var(--warn)':'var(--good)'}">${(dw>0?'+':'')+dw.toFixed(1)} kg</span> – ${Math.abs(dw)<0.3?'stabil, Kalorien passen zum Halten':dw>0?'Aufbau, wenn gewollt – sonst Kalorien leicht senken':'Abnahme – für Aufbau Kalorien leicht erhöhen'}</div>`:''}</div>`})()}
  <div class="grid4" style="margin-bottom:10px"><button class="btn primary" data-a="fscan">Scannen</button><button class="btn" data-a="fsearch">Suchen</button><button class="btn" data-a="fnew">Manuell</button><button class="btn" data-a="meals">Mahlzeit</button></div>
  ${items.length?`<div class="card list">${items.map((i,idx)=>`<div class="item"><div class="grow"><div>${esc(i.n)||'<span class="tiny">Ohne Namen</span>'}${i.amount?` <span class="tiny">${i.amount} ${i.unit||'g'}</span>`:''}</div><div class="tiny num">P ${r1(i.p)} · C ${r1(i.c)} · F ${r1(i.f)} · ${kcal(i)} kcal</div></div><button class="btn ghost small" data-a="rmm" data-i="${idx}">✕</button></div>`).join('')}</div>`:`<div class="empty">Noch nichts eingetragen.</div>`}
  ${S.foods.length?`<h2>Zuletzt verwendet</h2><div class="card">${recentFoods().slice(0,8).map(f=>foodRow(f)).join('')}</div>`:''}`;
}
const r1=v=>Math.round(v*10)/10;
function dayIsTrain(d){if(S.dayType[d]!==undefined)return S.dayType[d];return S.workouts.some(w=>w.date.slice(0,10)===d)||(S.active&&d===today())}
function mealsSheet(){
  const items=S.macros[macroDay]||[];
  const draw=()=>{sheet(`<h3>Mahlzeiten</h3>
    ${S.meals.length?`<div class="list" style="margin-bottom:12px">${S.meals.map(m=>{const tot=mealTotals(m);return`<div class="item"><div class="grow"><div style="font-weight:600">${esc(m.name)}</div><div class="tiny num">${m.items.length} Produkte · ${tot.kcal} kcal · P ${r1(tot.p)}</div></div><button class="btn small primary" data-ma="book" data-id="${m.id}">Buchen</button><button class="btn ghost small" data-ma="del" data-id="${m.id}">✕</button></div>`}).join('')}</div>`:`<div class="muted" style="margin-bottom:12px">Noch keine Mahlzeiten gespeichert.</div>`}
    ${items.filter(i=>i.foodId).length?`<div class="tiny" style="margin-bottom:6px">Aus den Einträgen dieses Tages eine Mahlzeit speichern:</div><input id="mlname" placeholder="Name, z. B. Frühstück" style="margin-bottom:8px">${items.map((i,idx)=>i.foodId?`<label class="row" style="padding:6px 0"><input type="checkbox" data-idx="${idx}" checked style="width:22px;height:22px"><span class="grow">${esc(i.n)} <span class="tiny">${i.amount} ${i.unit}</span></span></label>`:'').join('')}<button class="btn wide" data-ma="save" style="margin-top:8px">Als Mahlzeit speichern</button>`:`<div class="tiny">Tipp: Buche die Produkte eines Frühstücks wie gewohnt, dann hier als Mahlzeit speichern – ab dann mit einem Tipp.</div>`}
    <button class="btn ghost wide" data-ma="close" style="margin-top:8px">Schließen</button>`);
    document.querySelector('#sheet .in').onclick=ev=>{const b=ev.target.closest('[data-ma]');if(!b)return;const a=b.dataset.ma;
      if(a==='close')closeSheet();
      if(a==='del'){S.meals=S.meals.filter(m=>m.id!==b.dataset.id);save();draw()}
      if(a==='book'){const m=S.meals.find(x=>x.id===b.dataset.id);let n=0;m.items.forEach(it=>{const f=S.foods.find(x=>x.id===it.foodId);if(!f)return;f.used=Date.now();n++;(S.macros[macroDay]=S.macros[macroDay]||[]).push({n:f.name,foodId:f.id,amount:it.amount,unit:f.unit,p:r1(f.p*it.amount/100),c:r1(f.c*it.amount/100),f:r1(f.f*it.amount/100),kcal:Math.round(fkcal(f)*it.amount/100)})});save();closeSheet();render();toast(n+' Produkte gebucht')}
      if(a==='save'){const name=document.getElementById('mlname').value.trim();if(!name){toast('Name fehlt');return}const sel=[...document.querySelectorAll('#sheet input[type=checkbox]:checked')].map(c=>items[+c.dataset.idx]).map(i=>({foodId:i.foodId,amount:i.amount}));if(!sel.length)return;S.meals.push({id:uid(),name,items:sel});save();toast('Mahlzeit gespeichert');draw()}};
  };draw();
}
function mealTotals(m){return m.items.reduce((a,it)=>{const f=S.foods.find(x=>x.id===it.foodId);if(!f)return a;return{p:a.p+f.p*it.amount/100,kcal:a.kcal+Math.round(fkcal(f)*it.amount/100)}},{p:0,kcal:0})}
const fkcal=f=>f.kcal||Math.round(f.p*4+f.c*4+f.f*9);
function recentFoods(){return [...S.foods].sort((a,b)=>(b.used||0)-(a.used||0))}
function foodRow(f,src){return `<button class="food" data-a="fpick" data-id="${f.id||''}" data-src="${src===undefined?'':src}"><div class="grow"><div class="fn">${esc(f.name)}</div><div class="fb">${esc(f.brand||'')}</div></div><div class="fm num">${fkcal(f)} kcal · P ${r1(f.p)} <span class="tiny">/100 ${f.unit||'g'}</span></div></button>`}

/* ---------- Lebensmittel: Open Food Facts ---------- */
const OFF_FIELDS='code,product_name,product_name_de,brands,nutriments,quantity';
function offToFood(pr){const n=pr.nutriments||{};const q=(pr.quantity||'').toLowerCase();
  return{id:uid(),name:pr.product_name_de||pr.product_name||'',brand:pr.brands||'',barcode:pr.code||'',unit:/ml|\bl\b|liter/.test(q)?'ml':'g',
    p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,kcal:Math.round(+n['energy-kcal_100g']||0)||null}}
async function offBarcode(code){const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);if(!r.ok)return null;const j=await r.json();return j.status===1&&j.product?offToFood(j.product):null}
async function offSearch(q){const r=await fetch(`https://de.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=${OFF_FIELDS}`);if(!r.ok)return[];const j=await r.json();return(j.products||[]).map(offToFood).filter(f=>f.name&&(f.p||f.c||f.f))}
let offCache=[];
function searchSheet(){
  sheet(`<h3>Lebensmittel suchen</h3><input id="fq" placeholder="z. B. Skyr, Haferflocken, Hähnchenbrust" autocapitalize="off" autocorrect="off"><div id="fres" style="margin-top:8px"></div>`);
  const inp=document.getElementById('fq'),res=document.getElementById('fres');setTimeout(()=>inp.focus(),50);
  let t=null;const local=q=>S.foods.filter(f=>(f.name+' '+(f.brand||'')).toLowerCase().includes(q.toLowerCase()));
  const draw=(l,o,loading)=>{res.innerHTML=(l.length?`<div class="tiny" style="margin:6px 0">Meine Produkte</div>${l.map(f=>foodRow(f)).join('')}`:'')+(loading?`<div class="muted" style="padding:12px 0">Suche in Open Food Facts…</div>`:o.length?`<div class="tiny" style="margin:10px 0 6px">Open Food Facts</div>${o.map((f,i)=>foodRow(f,i)).join('')}`:'')+(!l.length&&!o.length&&!loading&&inp.value.length>1?`<div class="muted" style="padding:12px 0">Nichts gefunden – manuell anlegen?</div><button class="btn small" data-a="fnew">Manuell anlegen</button>`:'')};
  inp.oninput=()=>{const q=inp.value.trim();clearTimeout(t);offCache=[];draw(local(q),[],q.length>1);if(q.length<2)return;t=setTimeout(async()=>{try{const o=await offSearch(q);if(inp.value.trim()!==q)return;offCache=o;draw(local(q),o,false)}catch(e){draw(local(q),[],false);toast('Keine Verbindung')}},500)};
  draw(recentFoods().slice(0,8),[],false);
  document.querySelector('#sheet .in').onclick=ev=>{const b=ev.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='fpick'){const f=b.dataset.src!==''?offCache[+b.dataset.src]:S.foods.find(x=>x.id===b.dataset.id);amountSheet(f)}
    if(b.dataset.a==='fnew')foodForm({name:inp.value.trim()})};
}
function foodForm(f,after){
  f=Object.assign({id:uid(),name:'',brand:'',barcode:'',unit:'g',p:0,c:0,f:0,kcal:null},f);
  sheet(`<h3>${f.barcode&&!f.name?'Produkt nicht gefunden':'Produkt'}</h3>${f.barcode?`<div class="tiny" style="margin-bottom:8px">Barcode ${esc(f.barcode)}</div>`:''}
  <div class="field"><label class="f">Name</label><input id="ffn" value="${esc(f.name)}"></div>
  <div class="field"><label class="f">Marke (optional)</label><input id="ffb" value="${esc(f.brand)}"></div>
  <div class="tiny" style="margin:4px 0 8px">Nährwerte pro 100 <span id="ffu">${f.unit}</span> <button class="btn ghost small" data-fa="unit">g / ml wechseln</button></div>
  <div class="grid4"><div><label class="f">Protein</label><input type="number" inputmode="decimal" id="ffp" value="${f.p||''}"></div><div><label class="f">Carbs</label><input type="number" inputmode="decimal" id="ffc" value="${f.c||''}"></div><div><label class="f">Fett</label><input type="number" inputmode="decimal" id="fff" value="${f.f||''}"></div><div><label class="f">kcal</label><input type="number" inputmode="decimal" id="ffk" value="${f.kcal||''}" placeholder="auto"></div></div>
  <div class="grid2" style="margin-top:14px"><button class="btn" data-fa="close">Abbrechen</button><button class="btn primary" data-fa="save">Speichern & Menge</button></div>
  ${S.foods.some(x=>x.id===f.id)?`<button class="btn ghost danger wide" data-fa="del" style="margin-top:6px">Produkt löschen</button>`:''}`);
  document.querySelector('#sheet .in').onclick=ev=>{const a=ev.target.closest('[data-fa]')?.dataset.fa;if(!a)return;
    if(a==='unit'){f.unit=f.unit==='g'?'ml':'g';document.getElementById('ffu').textContent=f.unit}
    if(a==='close')closeSheet();
    if(a==='del'){S.foods=S.foods.filter(x=>x.id!==f.id);save();closeSheet();render()}
    if(a==='save'){f.name=document.getElementById('ffn').value.trim();f.brand=document.getElementById('ffb').value.trim();['p','c','f'].forEach(k=>f[k]=+document.getElementById('ff'+k).value||0);f.kcal=+document.getElementById('ffk').value||null;
      if(!f.name){toast('Name fehlt');return}amountSheet(f)}};
}
function amountSheet(f){
  f=Object.assign({id:uid(),unit:'g'},f);
  const draw=()=>{const a=+document.getElementById('fam')?.value||100,m=k=>f[k]*a/100;document.getElementById('fcalc').innerHTML=`<div><b>${Math.round(fkcal(f)*a/100)}</b><small>kcal</small></div><div><b>${r1(m('p'))}</b><small>Protein</small></div><div><b>${r1(m('c'))}</b><small>Carbs</small></div><div><b>${r1(m('f'))}</b><small>Fett</small></div>`};
  sheet(`<h3>${esc(f.name)}</h3><div class="tiny" style="margin-bottom:12px">${esc(f.brand||'')}${f.brand?' · ':''}pro 100 ${f.unit}: ${fkcal(f)} kcal · P ${r1(f.p)} · C ${r1(f.c)} · F ${r1(f.f)}</div>
  <div class="amt"><input type="number" inputmode="decimal" id="fam" value="100"><span>${f.unit}</span></div>
  <div style="margin-top:8px">${[50,100,150,200,250,300,500].map(v=>`<button class="chip" data-fa="q" data-v="${v}">${v}</button>`).join('')}</div>
  <div class="calc" id="fcalc"></div>
  <div class="grid2"><button class="btn" data-fa="edit">Bearbeiten</button><button class="btn primary" data-fa="add">Hinzufügen</button></div>`);
  draw();const inp=document.getElementById('fam');inp.oninput=draw;setTimeout(()=>{inp.focus();inp.select()},50);
  document.querySelector('#sheet .in').onclick=ev=>{const b=ev.target.closest('[data-fa]');if(!b)return;const a=b.dataset.fa;
    if(a==='q'){inp.value=b.dataset.v;draw()}
    if(a==='edit')foodForm(f);
    if(a==='add'){const amt=+inp.value;if(!amt){toast('Menge eingeben');return}
      const i=S.foods.findIndex(x=>x.id===f.id);f.used=Date.now();i<0?S.foods.push(f):S.foods[i]=f;
      (S.macros[macroDay]=S.macros[macroDay]||[]).push({n:f.name,foodId:f.id,amount:amt,unit:f.unit,p:r1(f.p*amt/100),c:r1(f.c*amt/100),f:r1(f.f*amt/100),kcal:Math.round(fkcal(f)*amt/100)});
      save();closeSheet();render();toast('Hinzugefügt')}};
}
/* Scanner: native BarcodeDetector, sonst ZXing */
let scanStop=null;
function scanSheet(){
  sheet(`<h3>Barcode scannen</h3><div id="scan"><video id="scv" playsinline muted autoplay></video><div class="frame"></div></div><div class="muted" id="scmsg" style="margin:10px 0">Kamera wird gestartet…</div><button class="btn wide" data-fa="close">Abbrechen</button>`);
  const msg=document.getElementById('scmsg'),vid=document.getElementById('scv');let done=false;
  const found=async code=>{if(done)return;done=true;stopScan();msg.textContent='Gefunden: '+code+' – suche Produkt…';
    const known=S.foods.find(x=>x.barcode===code);if(known){amountSheet(known);return}
    try{const f=await offBarcode(code);f?amountSheet(f):foodForm({barcode:code})}catch(e){foodForm({barcode:code})}};
  const stopScan=()=>{if(scanStop){scanStop();scanStop=null}};
  (async()=>{try{
    if('BarcodeDetector'in window){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vid.srcObject=st;const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      const iv=setInterval(async()=>{try{const r=await det.detect(vid);if(r.length)found(r[0].rawValue)}catch(e){}},300);scanStop=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop())}}
    else{if(!window.ZXing)await new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='zxing.min.js';sc.onload=ok;sc.onerror=err;document.head.appendChild(sc)});
      const reader=new ZXing.BrowserMultiFormatReader();await reader.decodeFromConstraints({video:{facingMode:'environment'}},vid,(res)=>{if(res)found(res.getText())});scanStop=()=>reader.reset()}
    msg.textContent='Barcode ins Feld halten';
  }catch(e){msg.textContent='Kamera nicht verfügbar: '+e.message}})();
  document.querySelector('#sheet .in').onclick=ev=>{if(ev.target.closest('[data-fa=close]')){stopScan();closeSheet()}};
  document.getElementById('sheet').addEventListener('click',function h(e){if(e.target.id==='sheet'){stopScan();this.removeEventListener('click',h)}});
}
function goalsSheet(){
  const gr=S.goalsRest||S.goals,row=(pre,g)=>`<div class="grid3">${[['p','Protein'],['c','Carbs'],['f','Fett']].map(([k,l])=>`<div><label class="f">${l} (g)</label><input type="number" inputmode="numeric" id="${pre}${k}" value="${g[k]}"></div>`).join('')}</div>`;
  sheet(`<h3>Tagesziele</h3><div class="muted" style="margin-bottom:6px">Trainingstag</div>${row('g',S.goals)}
  <div class="muted" style="margin:14px 0 6px">Ruhetag</div>${row('r',gr)}
  <div class="tiny" style="margin:8px 0 16px">Trainingstag wird automatisch erkannt, sobald ein Training gespeichert ist; im Makros-Tab lässt sich das pro Tag umschalten.</div>
  <div class="grid2"><button class="btn" data-pa="close">Abbrechen</button><button class="btn primary" data-pa="save">Speichern</button></div>`);
  document.querySelector('#sheet .in').onclick=ev=>{const a=ev.target.closest('[data-pa]')?.dataset.pa;if(!a)return;if(a==='save'){['p','c','f'].forEach(k=>S.goals[k]=+document.getElementById('g'+k).value||0);S.goalsRest={};['p','c','f'].forEach(k=>S.goalsRest[k]=+document.getElementById('r'+k).value||0);save();render()}closeSheet()};
}

/* ---------- Sheet ---------- */
function sheet(html){document.querySelector('#sheet .in').innerHTML=html;document.getElementById('sheet').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function prompt2(title,cb,ph=''){sheet(`<h3>${title}</h3><input id="pv" placeholder="${ph}" style="margin-bottom:14px"><div class="grid2"><button class="btn" data-pa="close">Abbrechen</button><button class="btn primary" data-pa="ok">OK</button></div>`);
  const inp=document.getElementById('pv');setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter')go()};
  const go=()=>{const v=inp.value.trim();closeSheet();if(v)cb(v)};
  document.querySelector('#sheet .in').onclick=ev=>{const a=ev.target.closest('[data-pa]')?.dataset.pa;if(a==='ok')go();if(a==='close')closeSheet()}}

/* ---------- Events ---------- */
app.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&S.active){S.active.exercises[t.dataset.i].sets[t.dataset.s][t.dataset.f]=+t.value||0;save()}
  if(t.id==='restIn'){S.settings.rest=+t.value||90;save()}
  if(t.id==='ovIn'){S.settings.overload=+t.value||2.5;save()}
});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)appAction(b)});
function appAction(b){const a=b.dataset.a,d=b.dataset;
  if(a==='start')startWorkout(d.id);
  if(a==='cancel'&&confirm('Training verwerfen?')){S.active=null;stopTimer();save();render()}
  if(a==='finish')finishWorkout();
  if(a==='done'){const s=S.active.exercises[d.i].sets[d.s];
    if(!s.done){const prev=lastSets(S.active.exercises[d.i].name);if(!s.w&&prev?.[d.s])s.w=prev[d.s].w;if(!s.r&&prev?.[d.s])s.r=prev[d.s].r;if(!s.w||!s.r){toast('kg und Reps eintragen');return}s.done=true;startTimer(S.settings.rest)}else s.done=false;
    save();render()}
  if(a==='wu'){const st=S.active.exercises[d.i].sets[d.s];st.wu=!st.wu;save();render()}
  if(a==='addwu'){S.active.exercises[d.i].sets.unshift({w:0,r:0,done:false,wu:true});save();render()}
  if(a==='note'){const n=S.active.exercises[d.i].name;sheet(`<h3>${esc(n)}</h3><div class="tiny" style="margin-bottom:8px">Notiz erscheint bei jedem Training mit dieser Übung.</div><input id="pv" value="${esc(S.exNotes[n]||'')}" placeholder="z. B. Sitz 4, enger Griff" style="margin-bottom:14px"><div class="grid2"><button class="btn" data-pa="close">Abbrechen</button><button class="btn primary" data-pa="ok">Speichern</button></div>`);
    document.querySelector('#sheet .in').onclick=ev=>{const x=ev.target.closest('[data-pa]')?.dataset.pa;if(x==='ok'){const v=document.getElementById('pv').value.trim();if(v)S.exNotes[n]=v;else delete S.exNotes[n];save();render()}if(x)closeSheet()}}
  if(a==='addset'){const ss=S.active.exercises[d.i].sets,l=ss[ss.length-1];ss.push({w:l?l.w:0,r:l?l.r:0,done:false});save();render()}
  if(a==='rmset'){S.active.exercises[d.i].sets.pop();save();render()}
  if(a==='rmex'){S.active.exercises.splice(+d.i,1);save();render()}
  if(a==='addex')prompt2('Übung',n=>{S.active.exercises.push({name:n,sets:[{w:0,r:0,done:false},{w:0,r:0,done:false},{w:0,r:0,done:false}]});save();render()},'z. B. Bankdrücken');
  if(a==='showw')summarySheet(d.id);
  if(a==='settings')settingsSheet();
  if(a==='editplan')planSheet(d.id);
  if(a==='pex'){progEx=d.n;render()}
  if(a==='savew'){const v=+document.getElementById('wIn').value;if(!v)return;S.weights=S.weights.filter(x=>x.d!==today());S.weights.push({d:today(),w:v});save();toast('Gespeichert');render()}
  if(a==='savem'){const e={d:today()};['waist','chest','arm','thigh'].forEach(k=>{const v=+document.getElementById('ms_'+k).value;if(v)e[k]=v});if(Object.keys(e).length<2)return;S.measures=S.measures.filter(x=>x.d!==today());S.measures.push(e);save();toast('Gespeichert');render()}
  if(a==='rmw'){S.weights=S.weights.filter(x=>x.d!==d.d);save();render()}
  if(a==='timer')startTimer(+d.s);
  if(a==='mday'){const dt=new Date(macroDay+'T12:00');dt.setDate(dt.getDate()+ +d.o);macroDay=dt.toISOString().slice(0,10);render()}
  if(a==='goals')goalsSheet();
  if(a==='meals')mealsSheet();
  if(a==='daytype'){S.dayType[macroDay]=!dayIsTrain(macroDay);save();render()}
  if(a==='fscan')scanSheet();
  if(a==='fsearch')searchSheet();
  if(a==='fnew')foodForm({});
  if(a==='fpick')amountSheet(S.foods.find(x=>x.id===d.id));
  if(a==='rmm'){S.macros[macroDay].splice(+d.i,1);save();render()}
  if(a==='syncsave'){SY.repo=document.getElementById('syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');SY.token=document.getElementById('syTok').value.trim();SY.sha=null;SY.state='off';saveSY();if(SY.token){toast('Verbinde…');pullSync().then(()=>{settingsSheet();toast(SY.state==='ok'?'Cloud-Backup aktiv':'Verbindung fehlgeschlagen')})}else settingsSheet()}
  if(a==='syncnow')pushSync();
  if(a==='syncpull'&&confirm('Lokale Daten durch das Cloud-Backup ersetzen?'))pullSync(true);
  if(a==='csvw'){const rows=[['Datum','Plan','Übung','Satz','Aufwärmen','kg','Reps','e1RM']];S.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach((st,i)=>rows.push([w.date.slice(0,10),w.name,e.name,i+1,st.wu?'ja':'',st.w,st.r,st.wu?'':Math.round(e1rm(st.w,st.r))]))));dl('training-'+today()+'.csv',csv(rows),'text/csv')}
  if(a==='csvm'){const rows=[['Datum','Produkt','Menge','Einheit','Protein','Carbs','Fett','kcal']];Object.keys(S.macros).sort().forEach(dd=>S.macros[dd].forEach(i=>rows.push([dd,i.n,i.amount||'',i.unit||'',i.p,i.c,i.f,i.kcal||Math.round(i.p*4+i.c*4+i.f*9)])));dl('ernaehrung-'+today()+'.csv',csv(rows),'text/csv')}
  if(a==='checkupd')checkUpdate(true);
  if(a==='changelog')changelogSheet();
  if(a==='export')dl('performance-backup-'+today()+'.json',JSON.stringify(S),'application/json');
  if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=Object.assign({},def,JSON.parse(r.result));save();toast('Backup geladen');render()}catch(e){toast('Ungültige Datei')}};r.readAsText(i.files[0])};i.click()}
}
window.addEventListener('resize',()=>{if(tab==='progress')drawProgress();if(tab==='body')drawWeight()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
function dl(name,content,type){const bl=new Blob([type.includes('csv')?'\ufeff'+content:content],{type}),u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();setTimeout(()=>{l.remove();URL.revokeObjectURL(u)},2000)}
const csv=rows=>rows.map(r=>r.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
let latestInfo=null;
async function checkUpdate(manual){
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();latestInfo=j;
    if(j.version!==APP_VERSION){document.getElementById('upd').classList.add('on');if(manual)toast('Update '+j.version+' verfügbar')}else if(manual)toast('Aktuell')}
  catch(e){if(manual)toast('Prüfung fehlgeschlagen')}
}
document.getElementById('upd').onclick=async()=>{try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  try{await fetch('index.html?t='+Date.now(),{cache:'reload'})}catch(e){}location.replace(location.pathname+'?t='+Date.now())};
function changelogSheet(){const info=latestInfo&&latestInfo.version===APP_VERSION?latestInfo:null;
  sheet(`<h3>Was ist neu</h3>${(info?info.changes:CHANGES).map(c=>`<div class="item"><span class="tiny" style="min-width:36px">v${c.v}</span><span>${c.t.map(esc).join('<br>')}</span></div>`).join('')}<button class="btn wide" data-pa="close" style="margin-top:12px">OK</button>`);
  document.querySelector('#sheet .in').onclick=ev=>{if(ev.target.closest('[data-pa=close]'))closeSheet()}}
const CHANGES=[{v:'7',t:['Einstellungen ins Zahnrad-Menü verschoben']},{v:'6',t:['Main-Übung mit 3-5-7-System (10×3 → 7×5 → 5×7 → +Schritt)','Übungen als Freihand / Maschine / Kabelturm markiert']},{v:'5',t:['Overload-Vorschlag beim Start (Ziel-Reps geschafft → +2,5 kg)','Wochenübersicht und "zuletzt vor X Tagen" pro Plan','Notizen pro Übung, Aufwärmsätze','Mahlzeiten mit einem Tipp buchen','Ziele für Trainings- und Ruhetag, 7-Tage-Schnitt mit Gewichtstrend','Körpermaße, geglätteter Gewichtstrend','Update-Hinweis, CSV-Export']},{v:'4',t:['Makros: Barcode-Scanner, Open Food Facts, Mengenrechner']},{v:'3',t:['Automatisches Cloud-Backup (GitHub)']},{v:'2',t:['Letztes Training als Vorlage, Kraftvergleich nach dem Training']},{v:'1',t:['Erste Version']}];
if(localStorage.getItem('perf.seen')!==APP_VERSION){localStorage.setItem('perf.seen',APP_VERSION);if(localStorage.getItem(KEY))setTimeout(changelogSheet,600)}
render();pullSync();checkUpdate();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
</body>
